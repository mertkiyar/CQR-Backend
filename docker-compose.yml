  version: '3.8'

  services:
    db:
      image: postgres:17-alpine
      container_name: cqr_postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: classqroom
        POSTGRES_USER: ${DB_USERNAME}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - postgres_data:/var/lib/postgresql/data

    app:
      build: .
      container_name: cqr_backend
      restart: unless-stopped
      expose:
        - "8080"
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/classqroom
        SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
        SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
        JAVA_OPTS: ${JAVA_OPTS:-"-Xmx256m -Xms128m"}
      depends_on:
        - db

    nginx:
      image: nginx:alpine
      container_name: cqr_backend_nginx
      restart: unless-stopped
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - app

  volumes:
    postgres_data: